version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: books-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: books_user
      POSTGRES_PASSWORD: books_password
      POSTGRES_DB: books_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
